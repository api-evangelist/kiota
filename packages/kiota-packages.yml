description: >-
  Kiota ships two distinct package families, and they version independently.
  (1) The GENERATOR — the `kiota` CLI itself, distributed as a .NET global tool
  (Microsoft.OpenApi.Kiota), an npm wrapper (@microsoft/kiota), a container
  image (mcr.microsoft.com/openapi/kiota), OS binaries on GitHub Releases, and a
  VS Code extension. These track the tool version (1.34.1 at capture).
  (2) The RUNTIME LIBRARIES — the per-language abstractions, HTTP, serialization,
  authentication and bundle packages that generated clients take a dependency on.
  These live in separate repos (microsoft/kiota-dotnet, kiota-java, kiota-python,
  kiota-typescript, kiota-go, kiota-php, kiota-ruby) and carry their own version
  lines. All packages below are published by Microsoft and are first-party.
families:
  - name: generator
    description: The kiota code generator / CLI, in every distribution channel it ships in.
  - name: runtime
    description: >-
      Abstractions, HTTP request adapters, serialization providers, authentication
      providers and bundles that Kiota-generated clients depend on at runtime.
      One set per supported language.
packages:
