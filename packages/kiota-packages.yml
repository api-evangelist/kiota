  - language: dotnet
    family: generator
    registry: nuget
    name: Microsoft.OpenApi.Kiota
    version: 1.34.1
    url: https://www.nuget.org/packages/Microsoft.OpenApi.Kiota
    install: dotnet tool install --global Microsoft.OpenApi.Kiota
    official: true
    note: The kiota CLI as a .NET global tool.
