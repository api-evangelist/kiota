description: >-
  Kiota keeps a Keep a Changelog formatted CHANGELOG.md in the repository root
  and mirrors each version as a tagged GitHub Release. Versioning is Semantic
  Versioning 2.0.0 (major.minor.patch); minor releases target the first Tuesday
  of each month and patches ship as needed. This artifact captures the recent
  window only — CHANGELOG.md is the source of truth. Note that the runtime
  libraries (kiota-dotnet, kiota-java, kiota-python, kiota-typescript, kiota-go,
  kiota-php, kiota-ruby) each keep their own separate changelog.
