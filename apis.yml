aid: kiota
name: Kiota
description: >-
  Kiota is Microsoft's open source (MIT) API client generator: a command line
  tool that turns any OpenAPI-described API into a strongly-typed, lightweight
  client in C#, Dart, Go, Java, PHP, Python, Ruby or TypeScript. It exists to
  remove the need to take a dependency on a different hand-written SDK for every
  API you call. Kiota generates only the source it needs on top of a small
  per-language core library, keeps external dependencies minimal, and can target
  a filtered subset of a large description. Beyond code SDKs it also emits
  agent-facing plugin packages — apiplugin for Microsoft 365 Copilot declarative
  agents, openai manifests, and API Manifest permission snapshots. Kiota is a
  consumer of API descriptions rather than a publisher of an API: there is no
  Kiota endpoint, base URL, API key or status page. Its surface is a CLI, runtime
  libraries in eight package registries, a published OpenAPI extension
  vocabulary, and a nine-rule description validation ruleset it runs before every
  generation.
